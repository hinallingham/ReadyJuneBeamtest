[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "@GEOM_IN@"
detectors_file_updated = "@GEOM_OUT@"
histogram_file         = "prealign_run@RUN@.root"
workers = 4
number_of_events = 5000

[EventLoaderMALTA]
real_data = true
#use_l1id = true
detector_names = "MALTA_0", "MALTA_1", "MALTA_2"
base_path = "/home/hinata/MALTA2/Ready_June/data"
run_number = @RUN@

[ClusteringSpatial]
charge_weighting = false
reject_by_roi = false

[FilterEvents]
max_clusters_per_plane = 1

[Prealignment]
method = "gauss_fit"
#fit_range_rel = 3.0