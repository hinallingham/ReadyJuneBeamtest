[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "@GEOM_IN@"
detectors_file_updated = "@GEOM_OUT@"
histogram_file         = "align_millepede_run@RUN@.root"
workers = 4
number_of_events = -1

[EventLoaderMALTA]
real_data = true
#use_l1id = true
detector_names = "MALTA_0", "MALTA_1", "MALTA_2"
base_path = "/home/hinata/MALTA2/Ready_June/data"
run_number = @RUN@

[ClusteringSpatial]
charge_weighting = false
reject_by_roi = false

[FilterEvents]
max_clusters_per_plane = 1

[Correlations]

[Tracking4D]
track_model = "straightline"
require_detectors = "MALTA_0","MALTA_2"
min_hits_on_track = 2
spatial_cut_abs = 100um, 100um
exclude_dut = false

[AlignmentMillepede]
iterations = 10
exclude_dut = false
dofs = true, true, false, true, true, true